[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vetorizafb"
version = "4.1.1"
description = "Experimental sounding extraction from georeferenced nautical charts"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "opencv-contrib-python==4.10.0.84", "Pillow>=10", "rasterio>=1.3,<2", "pyproj>=3.6,<4", "requests>=2.32,<3"]

[project.optional-dependencies]
ocr = ["paddleocr==3.7.0", "paddlepaddle==3.3.1"]
qt = ["PySide6>=6.7,<7"]
test = ["pytest>=8,<10"]

[project.scripts]
vetorizafb = "vetorizafb.cli:main"
vetorizafb-gui = "vetorizafb.gui:main"
vetorizafb-qt = "vetorizafb.qt_gui:main"
vetorizafb-classic = "vetorizafb.gui:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
vetorizafb = ["assets/*.html", "assets/*.png", "assets/*.ico", "assets/icons/*.svg"]
