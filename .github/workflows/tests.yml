name: tests
on: [push, pull_request]
permissions:
  contents: read
  actions: write
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core:
    timeout-minutes: 8
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Cancel superseded checks on this branch
        if: runner.os == 'Linux' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_BRANCH: ${{ github.head_ref }}
          CHECK_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow tests.yml --branch "$CHECK_BRANCH" --status in_progress --json databaseId,headSha --jq ".[] | select(.headSha != \"$CHECK_SHA\") | .databaseId" |
          while read -r obsolete_run; do
            gh run cancel "$obsolete_run" --repo "$GITHUB_REPOSITORY"
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q
      - if: runner.os == 'Windows'
        run: python -m pytest -q
